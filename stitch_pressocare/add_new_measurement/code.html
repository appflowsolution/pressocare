<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3ab9f8",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101c23",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        .backdrop-blur-custom {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased overflow-hidden">
<div class="fixed inset-0 z-0 flex flex-col p-6 opacity-40 grayscale-[0.5]">
<div class="flex justify-between items-center mb-8">
<div class="h-12 w-12 rounded-full bg-primary/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary">person</span>
</div>
<div class="h-10 w-10 rounded-full bg-slate-800 flex items-center justify-center">
<span class="material-symbols-outlined text-slate-400">notifications</span>
</div>
</div>
<div class="h-40 w-full rounded-lg bg-gradient-to-br from-primary/20 to-transparent border border-primary/10 mb-6"></div>
<div class="grid grid-cols-2 gap-4">
<div class="h-32 rounded-lg bg-slate-800/50"></div>
<div class="h-32 rounded-lg bg-slate-800/50"></div>
</div>
</div>
<div class="fixed inset-0 z-50 flex flex-col justify-end bg-background-dark/60 backdrop-blur-sm">
<div class="relative flex flex-col w-full bg-slate-900 dark:bg-[#101c23] border-t border-slate-700/50 rounded-t-xl shadow-2xl max-h-[92vh] overflow-y-auto">
<div class="flex h-6 w-full items-center justify-center pt-2">
<div class="h-1.5 w-12 rounded-full bg-slate-700"></div>
</div>
<div class="px-6 pt-4 pb-2 text-center">
<span class="text-primary text-xs font-bold uppercase tracking-widest">PressoCare</span>
<h1 class="text-slate-100 text-2xl font-bold mt-1">Add New Measurement</h1>
</div>
<div class="px-6 py-6 flex flex-col gap-8">
<div class="flex flex-col gap-6">
<div class="flex items-center gap-3">
<div class="h-10 w-10 rounded-full bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary">monitor_heart</span>
</div>
<h2 class="text-xl font-semibold text-slate-100">Blood Pressure</h2>
</div>
<div class="grid grid-cols-2 gap-4">
<label class="flex flex-col gap-2">
<span class="text-slate-400 text-sm font-medium ml-1">Systolic (mmHg)</span>
<div class="relative group">
<input class="w-full h-16 bg-slate-800/50 border border-slate-700 rounded-xl px-4 text-2xl font-bold text-white placeholder:text-slate-600 focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all" placeholder="120" type="number"/>
<div class="absolute inset-0 rounded-xl pointer-events-none group-focus-within:shadow-[0_0_15px_rgba(58,185,248,0.2)]"></div>
</div>
</label>
<label class="flex flex-col gap-2">
<span class="text-slate-400 text-sm font-medium ml-1">Diastolic (mmHg)</span>
<div class="relative group">
<input class="w-full h-16 bg-slate-800/50 border border-slate-700 rounded-xl px-4 text-2xl font-bold text-white placeholder:text-slate-600 focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all" placeholder="80" type="number"/>
<div class="absolute inset-0 rounded-xl pointer-events-none group-focus-within:shadow-[0_0_15px_rgba(58,185,248,0.2)]"></div>
</div>
</label>
</div>
<label class="flex flex-col gap-2">
<span class="text-slate-400 text-sm font-medium ml-1">Pulse (BPM)</span>
<div class="relative group">
<input class="w-full h-16 bg-slate-800/50 border border-slate-700 rounded-xl px-4 text-2xl font-bold text-white placeholder:text-slate-600 focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all" placeholder="72" type="number"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2">
<span class="material-symbols-outlined text-red-500">favorite</span>
</div>
<div class="absolute inset-0 rounded-xl pointer-events-none group-focus-within:shadow-[0_0_15px_rgba(58,185,248,0.2)]"></div>
</div>
</label>
</div>
<div class="bg-slate-800/30 rounded-lg p-4 border border-slate-700/50">
<div class="flex justify-between items-center mb-3">
<span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Status Reference</span>
<span class="material-symbols-outlined text-slate-500 text-sm">info</span>
</div>
<div class="flex gap-2 h-2 rounded-full overflow-hidden mb-3">
<div class="flex-1 bg-green-500"></div>
<div class="flex-1 bg-yellow-500"></div>
<div class="flex-1 bg-orange-500"></div>
<div class="flex-1 bg-red-500"></div>
</div>
<div class="flex justify-between text-[10px] text-slate-500 font-medium">
<span>NORMAL</span>
<span>ELEVATED</span>
<span>STAGE 1</span>
<span>STAGE 2</span>
</div>
</div>
<div class="flex flex-col gap-3 pt-4 pb-8">
<button class="w-full h-14 bg-gradient-to-r from-primary to-blue-600 text-white font-bold text-lg rounded-xl shadow-lg shadow-primary/20 hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">save</span>
                        Save Measurement
                    </button>
<button class="w-full h-14 bg-transparent text-slate-400 font-medium text-base rounded-xl hover:bg-slate-800/50 transition-all">
                        Cancel
                    </button>
</div>
</div>
</div>
</div>

</body></html>
